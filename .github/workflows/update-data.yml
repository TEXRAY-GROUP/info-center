name: 更新資料

on:
  schedule:
    # 週一至週五(台銀假日不掛牌)。分鐘刻意選冷門值:
    # GitHub 排程在每小時開頭(:00 :05 :15 :30)高負載,常延遲數十分鐘甚至整輪跳過。
    - cron: '23 1 * * 1-5'    # UTC 01:23 = 台北 09:23,台銀開盤後,先確保有前一日牌告與當週燃油
    - cron: '47 8 * * 1-5'    # UTC 08:47 = 台北 16:47,收盤後,嘗試取得當日牌告
    - cron: '43 10 * * 1-5'   # UTC 10:43 = 台北 18:43,保險:已驗證此時段必定取得當日牌告
    #
    # 為什麼要三次:資料源何時發布當日牌告未經完整驗證——
    # 只確認過台北 17:24 拿得到當日、09:02 只有前一日。16:47 是否來得及尚待觀察,
    # 故保留 18:43 這輪兜底。累積幾天紀錄確認 16:47 可行後,可移除第三筆。
  workflow_dispatch:        # 也可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 目前排程用到的腳本全部只用 Python 標準庫,這步實際上不會裝到東西。
      # 仍保留的原因:先前加運費積木時,腳本需要 PyMuPDF 卻沒有對應的安裝步驟,
      # 而其餘腳本因為只用標準庫仍會通過,本機開發又早已裝好套件,結果是
      # 「本機能跑、CI 不能跑」而且只有那一步紅。留著這步,日後新積木只要把
      # 套件寫進 requirements.txt 就會生效,不會再踩同一個坑。
      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 各來源一律 continue-on-error:單一來源掛掉不該讓其他抓好的資料無法入庫。
      # 失敗與否在最後一步統一回報,確保執行紀錄仍然是紅的、不會被忽略。
      # ---------------------------------------------------------------
      - name: 抓取匯率(臺灣銀行牌告)
        id: rates
        continue-on-error: true
        run: python scripts/fetch_rates.py

      # 燃油附加費:DHL 自動抓,FedEx 讀 data/fuel_manual.json(人工每週維護)
      # 產出的 data/fuel.json 供內部運費試算工具跨域取用
      - name: 抓取燃油附加費
        id: fuel
        continue-on-error: true
        run: python scripts/fetch_fuel.py

      - name: 抓取紡織產業新聞
        id: news
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: 抓取品牌客戶動態
        id: brands
        continue-on-error: true
        run: python scripts/fetch_brands.py

      - name: 抓取原物料價格
        id: materials
        continue-on-error: true
        run: python scripts/fetch_materials.py

      # 運費公告價(data/freight.json)刻意不放在這裡:
      #   1. 兩家都是「年度」價目表(DHL 1/1、FedEx 1/5 生效),一年才換一次,
      #      每天抓三次、下載 6 MB PDF 重新解析,得到的永遠是同一份資料。
      #   2. FedEx 的 Akamai 會擋 GitHub 機房 IP(下載到的不是 PDF),
      #      在 Actions 裡根本抓不到,必須從台灣的網路環境執行。
      # 因此改為本機產生後提交,並由 freight-annual-check.yml 每月檢查是否該換年度版。

      # 未來新增積木時,在這裡照上面的格式加一步(記得補 id 與 continue-on-error,
      # 並在「回報失敗來源」那步加一行 check)

      # if: always() —— 前面任一來源失敗時仍要執行,把成功抓到的資料存進去
      - name: 有變動才 commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料無變動,略過 commit"
          else
            git commit -m "資料自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # 有任何來源失敗就讓整個 job 判定為失敗,才不會安靜地壞掉沒人發現
      - name: 回報失敗的來源
        if: always()
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 抓取失敗($2)"
              fail=1
            fi
          }
          check 匯率        "${{ steps.rates.outcome }}"
          check 燃油附加費  "${{ steps.fuel.outcome }}"
          check 紡織產業新聞 "${{ steps.news.outcome }}"
          check 品牌客戶動態 "${{ steps.brands.outcome }}"
          check 原物料價格  "${{ steps.materials.outcome }}"
          if [ "$fail" = "0" ]; then echo "全部來源皆正常"; fi
          exit $fail
