name: 更新資料

on:
  schedule:
    # UTC 00:05 = 台北時間 08:05,週一至週五(台銀假日不掛牌)
    - cron: '5 0 * * 1-5'
  workflow_dispatch:        # 也可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取匯率(臺灣銀行牌告)
        run: python scripts/fetch_rates.py

      # 燃油附加費:DHL 自動抓,FedEx 讀 data/fuel_manual.json(人工每週維護)
      # 產出的 data/fuel.json 供內部運費試算工具跨域取用
      - name: 抓取燃油附加費
        run: python scripts/fetch_fuel.py

      # 未來新增積木時,在這裡加一行 run: python scripts/fetch_<block>.py

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料無變動,略過 commit"
          else
            git commit -m "資料自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
